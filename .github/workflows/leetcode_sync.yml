name: Automated Daily LeetCode Sync

on:
  schedule:
    - cron: '0 18 * * *'  # Executes daily at 11:30 PM IST
  workflow_dispatch:

jobs:
  build-and-sync-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Network Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Code Sync Engine (Step 1)
      env:
        # 🔒 Passing your secure browser authentication values straight to the python script runtime environment
        LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
        LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
      run: python -u sync.py

    - name: Run Analytics Dashboard Engine (Step 2)
      env:
        LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
        LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
      run: python -u analytics.py

    - name: Commit and Push Sequenced Updates (Step 3)
      run: |
        git config --global user.name "AtulSingh-Emyre"
        git config --global user.email "atulsingh.pks@gmail.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "Automated System Sync: Solution Files & Performance Dashboard"
        git push origin main
