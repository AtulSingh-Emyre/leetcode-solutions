name: Generate Repo Analytics Dashboard

on:
  schedule:
    - cron: '0 6 * * *' # Runs automatically every morning at 6:00 AM UTC
  workflow_dispatch:   # Allows you to click "Run workflow" to update manually
  push:
    branches:
      - main           # Recalculates immediately when LeetHub pushes a new solution

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches history so script can parse timestamps

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Analytics Script
        run: python analytics.py

      - name: Commit and Push Updated Readme
        run: |
          git config --global user.name "GitHub Actions Analytics Bot"
          git config --global user.email "actions@github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Automated Dashboard Refresh [Skip CI]"
            git push
          else
            echo "No metrics modifications detected. Skipping push update."
          fi
